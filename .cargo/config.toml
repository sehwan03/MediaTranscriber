# whisper.cpp 빌드 최적화 플래그 고정
#
# whisper-rs-sys 는 MSBuild "Release" 구성으로 whisper.cpp 를 빌드하는데,
# cargo release 프로필에서는 cmake 크레이트(0.1.58)가 Visual Studio 생성기용으로
# CMAKE_<LANG>_FLAGS_RELEASE 를 최적화 옵션(/O2) 없는 값으로 덮어쓴다.
# 그 결과 release 실행 파일의 음성 인식이 debug 보다 약 7배 느려진다.
#
# whisper-rs-sys 는 CMAKE_* 환경변수를 CMake 정의로 전달하고, cmake 크레이트는
# 이미 정의된 변수는 덮어쓰지 않으므로 여기서 명시적으로 지정한다.
[env]
CMAKE_C_FLAGS_RELEASE = "/MD /O2 /Ob2 /DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "/MD /O2 /Ob2 /DNDEBUG"
